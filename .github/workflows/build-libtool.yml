name: Build LibTool

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java for Android SDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "7.2"

      - name: Install Android SDK and NDK
        run: sdkmanager --install "platforms;android-30" "build-tools;30.0.3" "ndk;23.1.7779620"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "11"
          cache: gradle

      - name: Build LibTool
        run: gradle --no-daemon :app:assembleRelease

      - name: Prepare LibTool artifact
        shell: bash
        run: |
          set -euo pipefail
          library="$(find app/build -type f -path '*/arm64-v8a/libTool.so' -print -quit)"
          if [[ -z "$library" ]]; then
            echo "Build completed but libTool.so was not found." >&2
            exit 1
          fi
          mkdir -p dist/arm64-v8a
          cp "$library" dist/arm64-v8a/libTool.so

      - name: Upload LibTool
        uses: actions/upload-artifact@v4
        with:
          name: LibTool-${{ github.sha }}
          path: dist/arm64-v8a/libTool.so
          if-no-files-found: error
